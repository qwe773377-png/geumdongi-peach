name: APK 만들기

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK 준비
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" "build-tools;34.0.0"

      - name: APK 빌드
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: APK 파일 준비
        run: cp android/app/build/outputs/apk/debug/app-debug.apk geumdongi-peach.apk

      - uses: actions/upload-artifact@v4
        with:
          name: geumdongi-peach-apk
          path: geumdongi-peach.apk

      - name: 다운로드 페이지에 APK 등록
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view apk-latest >/dev/null 2>&1 ||
            gh release create apk-latest --title "최신 APK" --notes "Android 테스트 설치 파일"
          gh release upload apk-latest geumdongi-peach.apk --clobber
